name: Scheduled Functions

on:
  schedule:
    # Cloudflare Pages has no cron triggers, so this replaces the Netlify five-minute schedules.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-functions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call weekly poll and reminders
        env:
          SITE_URL: https://7b-v3.pages.dev
        run: |
          for name in weekly-poll poll-deadline-reminder packing-reminder; do
            status=$(curl -sS -o body.json -w '%{http_code}' --max-time 60 --retry 2 --retry-all-errors -H 'cache-control: no-cache' "$SITE_URL/api/functions/$name" || echo 000)
            echo "$name -> $status $(head -c 300 body.json 2>/dev/null)"
            if [ "$status" != "200" ]; then echo "::warning title=$name::HTTP $status"; fi
          done

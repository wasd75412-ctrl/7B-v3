<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>7B 本機比分</title>
  <style>
    :root { color-scheme: dark; font-family: "Noto Sans TC", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #fff;
      background: radial-gradient(circle at 50% -10%, #245c80 0, #0b2941 42%, #061926 100%);
      padding: max(18px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom));
    }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    h1 { margin: 0; font-size: 1.2rem; }
    #status { color: #9fd6ff; font-size: .85rem; font-weight: 800; }
    .board {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px;
    }
    .team {
      border-radius: 22px; padding: 18px 12px; text-align: center;
      box-shadow: 0 14px 30px rgba(0,0,0,.22);
    }
    .a { border: 1px solid #58a8eb; background: linear-gradient(160deg, #155c94, #0b3a61); }
    .b { border: 1px solid #ee7d7d; background: linear-gradient(160deg, #a62d35, #681b26); }
    .team span, .team strong { display: block; }
    .team span { font-weight: 950; }
    .team strong { margin-top: 8px; font-size: clamp(4rem, 22vw, 8rem); line-height: 1; }
    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 14px; }
    button {
      min-height: 48px; border: 0; border-radius: 14px; font-weight: 950; font-size: 1rem;
      background: rgba(255,255,255,.92); color: #0a2b45;
    }
    button:disabled { opacity: .45; }
    #meta { margin-top: 14px; color: #b9d0df; font-size: .82rem; font-weight: 750; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>7B 本機比分</h1>
    <div id="status">連線中</div>
  </header>
  <div class="board">
    <article class="team a"><span>A隊</span><strong id="scoreA">0</strong></article>
    <article class="team b"><span>B隊</span><strong id="scoreB">0</strong></article>
  </div>
  <div class="actions">
    <button id="plusA" type="button">A ＋1</button>
    <button id="undo" type="button">撤銷</button>
    <button id="plusB" type="button">B ＋1</button>
  </div>
  <div id="meta">rev 0</div>
  <script>
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const scoreAEl = document.getElementById('scoreA');
    const scoreBEl = document.getElementById('scoreB');
    let busy = false;

    async function refresh() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error('state');
        const data = await response.json();
        render(data);
        statusEl.textContent = '本機已連線';
      } catch {
        statusEl.textContent = '連線中斷';
      }
    }

    function render(data) {
      const match = data.match || {};
      const scores = match.scores || [0, 0];
      scoreAEl.textContent = scores[0] ?? 0;
      scoreBEl.textContent = scores[1] ?? 0;
      const finished = match.winner === 0 || match.winner === 1;
      document.getElementById('plusA').disabled = finished;
      document.getElementById('plusB').disabled = finished;
      metaEl.textContent = `rev ${data.revision || 0}${data.pendingUpload ? ' · 待上傳' : ''}`;
    }

    async function send(action) {
      if (busy) return;
      busy = true;
      try {
        const response = await fetch('/api/action', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ action }),
        });
        const data = await response.json();
        render(data);
        statusEl.textContent = data.ok === false ? '無法計分' : '本機已連線';
      } catch {
        statusEl.textContent = '送出失敗';
      } finally {
        busy = false;
      }
    }

    document.getElementById('plusA').onclick = () => send('teamAPlus');
    document.getElementById('plusB').onclick = () => send('teamBPlus');
    document.getElementById('undo').onclick = () => send('undo');
    refresh();
    setInterval(refresh, 250);
  </script>
</body>
</html>

name = "7b-scheduler"
main = "index.js"
compatibility_date = "2025-10-03"
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false

# Cloudflare Pages has no cron triggers, so this Worker calls the scheduled Pages functions.
[triggers]
crons = ["*/5 * * * *"]

[vars]
SITE_URL = "https://7b-v3.pages.dev"
